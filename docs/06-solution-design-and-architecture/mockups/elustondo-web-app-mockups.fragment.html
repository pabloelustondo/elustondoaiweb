<style>
  #elustondo-app-mockups { color: var(--foreground); }
  #elustondo-app-mockups .ea-controls { margin-bottom: 16px; }
  #elustondo-app-mockups .ea-preview {
    margin-inline: auto;
    overflow: hidden;
    transition: max-width 180ms ease;
  }
  #elustondo-app-mockups .ea-preview.is-mobile { max-width: 370px; }
  #elustondo-app-mockups .ea-header {
    display: grid;
    grid-template-columns: minmax(150px, 220px) 1fr auto;
    gap: 18px;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  #elustondo-app-mockups .ea-logo {
    display: block;
    width: min(100%, 205px);
    height: auto;
  }
  #elustondo-app-mockups .ea-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }
  #elustondo-app-mockups .ea-nav a,
  #elustondo-app-mockups .ea-source-link {
    color: var(--foreground);
    text-decoration: none;
  }
  #elustondo-app-mockups .ea-menu-label { display: none; }
  #elustondo-app-mockups .ea-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(190px, 28%);
    gap: 24px;
    padding-top: 24px;
  }
  #elustondo-app-mockups .ea-kicker,
  #elustondo-app-mockups .ea-generated-label {
    color: var(--muted-foreground);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  #elustondo-app-mockups .ea-display {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    margin-top: 6px;
    margin-bottom: 12px;
  }
  #elustondo-app-mockups .ea-lead {
    max-width: 64ch;
    color: var(--muted-foreground);
  }
  #elustondo-app-mockups .ea-prompt { margin-top: 20px; }
  #elustondo-app-mockups .ea-prompt-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    align-items: end;
  }
  #elustondo-app-mockups .ea-prompt-row textarea {
    min-height: 74px;
    resize: vertical;
  }
  #elustondo-app-mockups .ea-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  #elustondo-app-mockups .ea-aside {
    border-left: 1px solid var(--border);
    padding-left: 20px;
  }
  #elustondo-app-mockups .ea-aside-list,
  #elustondo-app-mockups .ea-source-list {
    display: grid;
    gap: 12px;
    padding: 0;
    list-style: none;
  }
  #elustondo-app-mockups .ea-aside-item {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    align-items: start;
  }
  #elustondo-app-mockups .ea-result {
    display: grid;
    gap: 18px;
  }
  #elustondo-app-mockups .ea-result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  #elustondo-app-mockups .ea-result-body {
    display: grid;
    gap: 14px;
  }
  #elustondo-app-mockups .ea-step {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    align-items: start;
  }
  #elustondo-app-mockups .ea-step-number {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
    color: var(--foreground);
    font-weight: 500;
  }
  #elustondo-app-mockups .ea-notice {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: start;
    padding-block: 16px;
    border-block: 1px solid var(--border);
  }
  #elustondo-app-mockups .ea-footer {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted-foreground);
  }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-header {
    grid-template-columns: 1fr auto;
  }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-nav,
  #elustondo-app-mockups .ea-preview.is-mobile .ea-contact { display: none; }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-menu-label { display: inline-flex; }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-main { grid-template-columns: 1fr; }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-aside {
    border-left: 0;
    border-top: 1px solid var(--border);
    padding-left: 0;
    padding-top: 18px;
  }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-prompt-row { grid-template-columns: 1fr; }
  #elustondo-app-mockups .ea-preview.is-mobile .ea-result-header { display: grid; }
  @media (max-width: 620px) {
    #elustondo-app-mockups .ea-header { grid-template-columns: 1fr auto; }
    #elustondo-app-mockups .ea-nav,
    #elustondo-app-mockups .ea-contact { display: none; }
    #elustondo-app-mockups .ea-menu-label { display: inline-flex; }
    #elustondo-app-mockups .ea-main { grid-template-columns: 1fr; }
    #elustondo-app-mockups .ea-aside {
      border-left: 0;
      border-top: 1px solid var(--border);
      padding-left: 0;
      padding-top: 18px;
    }
    #elustondo-app-mockups .ea-prompt-row { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    #elustondo-app-mockups .ea-preview { transition: none; }
  }
</style>

      </ul>
    </div>
  </template>
</div>

<script>
  (() => {
    const root = document.getElementById('elustondo-app-mockups');
    const preview = document.getElementById('ea-preview');
    const content = document.getElementById('ea-state-content');
    const aside = document.getElementById('ea-state-aside');
    const stateButtons = Array.from(root.querySelectorAll('[data-state]'));
    const mobileToggle = document.getElementById('ea-mobile-toggle');

    function renderState(stateName) {
      const template = document.getElementById('ea-state-' + stateName);
      content.innerHTML = template.content.querySelector('.ea-template-content').innerHTML;
      aside.innerHTML = template.content.querySelector('.ea-template-aside').innerHTML;
      stateButtons.forEach((button) => {
        const selected = button.dataset.state === stateName;
        button.setAttribute('aria-pressed', String(selected));
        button.classList.toggle('btn-primary', selected);
      });
      if (window.lucide) {
        window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }
    }

    stateButtons.forEach((button) => {
      button.addEventListener('click', () => renderState(button.dataset.state));
    });

    mobileToggle.addEventListener('change', () => {
      preview.classList.toggle('is-mobile', mobileToggle.checked);
    });

    renderState('generated');
  })();
</script>
